services:
  # ==========================================
  # CONTROL PLANE (THE BRAIN)
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: hve-postgres
    environment:
      POSTGRES_USER: hve_admin
      POSTGRES_PASSWORD: hve_password123
      POSTGRES_DB: hve_control_plane
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mounts the init script to automatically run on first boot
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - hve-network

  # ==========================================
  # ICEBERG REST CATALOG
  # ==========================================
  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    container_name: hve-iceberg-rest
    environment:
      CATALOG_WAREHOUSE: s3a://hve-iceberg/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: 'true'
      AWS_ACCESS_KEY_ID: hve_admin
      AWS_SECRET_ACCESS_KEY: hve_password123
      AWS_REGION: us-east-1
      CATALOG_JDBC_URI: jdbc:postgresql://postgres:5432/hve_control_plane
      CATALOG_JDBC_USER: hve_admin
      CATALOG_JDBC_PASSWORD: hve_password123
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
    ports:
      - "8181:8181"
    depends_on:
      - postgres
      - minio
    networks:
      - hve-network

  # ==========================================
  # DATA PLANE (THE MUSCLE) - STORAGE
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: hve-minio
    environment:
      MINIO_ROOT_USER: hve_admin
      MINIO_ROOT_PASSWORD: hve_password123
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Console Port
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - hve-network

  # Sidecar to auto-create Bronze and Silver buckets
  minio-init:
    image: minio/mc:latest
    container_name: hve-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c " sleep 5; mc alias set local http://minio:9000 hve_admin hve_password123; mc mb local/hve-bronze || true; mc mb local/hve-silver || true; mc mb local/hve-iceberg || true; mc anonymous set none local/hve-bronze; mc anonymous set none local/hve-silver; mc anonymous set none local/hve-iceberg; exit 0; "
    networks:
      - hve-network

  # ==========================================
  # DATA PLANE (THE MUSCLE) - STREAMING
  # ==========================================
  kafka:
    image: apache/kafka:latest
    container_name: hve-kafka
    environment:
      # KRaft configuration for Apache Official Image
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      hve-network:
        aliases:
          - redpanda

  # Sidecar to auto-create Kafka topics
  kafka-init:
    image: apache/kafka:latest
    container_name: hve-kafka-init
    depends_on:
      - kafka
    entrypoint: >
      /bin/sh -c " echo 'Waiting for Kafka to be ready...'; until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do sleep 2; done; /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --config retention.ms=604800000 --topic raw-telemetry; /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --config retention.ms=604800000 --topic silver-telemetry; echo 'Kafka topics are ready.'; "
    networks:
      - hve-network

  # ==========================================
  # KNOWLEDGE GRAPH (NEO4J)
  # ==========================================
  neo4j:
    image: neo4j:5-community
    container_name: hve-neo4j
    environment:
      - NEO4J_AUTH=neo4j/hve_password123
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
    ports:
      - "7474:7474" # HTTP Browser
      - "7688:7687" # Bolt Protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - hve-network

networks:
  hve-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  kafka_data:
  neo4j_data:
  neo4j_logs:
